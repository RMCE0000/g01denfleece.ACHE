# DigitalOcean host. Use with the local file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Ports 3000 and 8025 are not published. Jane's admin API stays on the droplet loopback.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      rails:
        condition: service_healthy

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  mailpit:
    restart: unless-stopped
    ports: !override []

  rails:
    restart: unless-stopped
    ports: !override []

  sidekiq:
    restart: unless-stopped

  ollama:
    restart: unless-stopped

  jane:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"

volumes:
  caddy_data:
  caddy_config:
